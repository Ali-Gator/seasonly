name: OpenSpec

# The phase-boundary gate: `openspec validate --changes` fails on a requirement with
# no scenario, or a change with no spec delta and no `skip_specs: true`. Not in the
# pre-commit hook on purpose: a half-planned change must stay committable.
# @see openspec/specs/spec-workflow/spec.md

on:
  push:

concurrency:
  group: openspec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Scoped package: bare `openspec` on npm is an unrelated placeholder. Pinned, and
      # fetched rather than installed: nothing in the app imports it.
      - run: npx -y @fission-ai/openspec@1.13.0 validate --changes --no-interactive
