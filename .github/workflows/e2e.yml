name: E2E

# Playwright on every push, against a prebuilt server. Not in the pre-commit hook:
# a dev server per commit saturates the machine. `pnpm test` stays the manual
# phase-completion gate. No build step here: with CI set, playwright.config.ts
# builds and serves the app itself, with its own E2E keys (BL-11), so the build
# needs no secrets ({@link openspec/specs/observability/spec.md#requirement-observability-is-off-until-its-keys-are-set}).

on:
  push:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
