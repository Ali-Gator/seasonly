name: Eval weekly

# BL-15: the eval run in CI, weekly and on demand, report-only. A failed fetch or extraction
# fails the job (the stability evidence); metric drift against the committed
# evals/results.json only shows in the job summary. Needs no secret and no paid API: photos come
# from Wikimedia Commons, MediaPipe's WASM and models from public CDNs.
# Design: openspec/changes/archive/*-backlog-1/design.md, "BL-15" and Decision 5.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The photos change only with the manifest, so Commons is hit only then or on eviction. No
      # restore-keys: eval:fetch skips a file that exists, so a photo swapped at the same path
      # would restore stale and fail its hash.
      - uses: actions/cache@v4
        with:
          path: |
            evals/photos
            !evals/photos/.cache
          key: eval-photos-${{ hashFiles('evals/manifest.json') }}
      # Each photo's MediaPipe output, named by photo sha256 + EXTRACTOR_VERSION, so an older
      # entry is never stale: restore-keys reuse it and an extractor change only re-extracts. The
      # core (check, classifier) always reruns in Node. Saved only on success: a cold run over
      # 30 minutes keeps every run cold.
      - uses: actions/cache@v4
        with:
          path: evals/photos/.cache
          key: eval-extract-${{ hashFiles('evals/manifest.json', 'evals/extract.ts', 'apps/web/src/lib/capture/mediapipe.ts', 'apps/web/src/lib/capture/photo.ts', 'apps/web/package.json') }}
          restore-keys: eval-extract-
      - run: pnpm eval:fetch
      - run: pnpm eval:run
        env:
          EVAL_RESULTS: ${{ runner.temp }}/results.json
      - name: Summary
        continue-on-error: true
        env:
          FRESH: ${{ runner.temp }}/results.json
        run: |
          node -e '
            const fs = require("node:fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            const fresh = read(process.env.FRESH), committed = read("evals/results.json");
            const keys = ["agreement", "accuracy", "falseRejectRate", "catchRate"];
            const rows = ["| Set | Metric | Committed | This run | Delta |", "| --- | --- | --- | --- | --- |"];
            for (const set of ["metrics", "holdout"])
              for (const k of keys) {
                const c = committed[set]?.[k], f = fresh[set]?.[k];
                rows.push(`| ${set === "metrics" ? "tuning" : "holdout"} | ${k} | ${c ?? "-"} | ${f ?? "-"} | ${c == null || f == null ? "-" : (f - c).toFixed(4)} |`);
              }
            const head = `## Eval weekly\n\n${fresh.counts.photos} photos, MediaPipe ${fresh.mediapipe}. Report only: drift never fails this job.\n\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, head + rows.join("\n") + "\n");
          '
