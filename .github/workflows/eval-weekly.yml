name: Eval weekly

# BL-15: the eval run in CI, weekly and on demand, report-only. A failed fetch or extraction
# fails the job (the stability evidence); metric drift against the committed
# evals/results.json only shows in the job summary. Needs no secret and no paid API: photos come
# from Wikimedia Commons, MediaPipe's WASM and models from public CDNs.
# Design: openspec/changes/backlog-1/design.md, "BL-15" and Decision 5.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # evals/photos holds the photos and photos/.cache, each photo's MediaPipe output keyed by
      # photo sha256 + EXTRACTOR_VERSION (MediaPipe version + extract.ts + the app's model
      # constants), so a cached entry is never stale: an extractor change misses and re-extracts.
      # The core (check, classifier) always reruns in Node on the cached extraction, so an
      # analysis change never serves stale results. The extractor inputs join the key so such a
      # change saves a fresh cache instead of re-extracting every week (an exact key hit never
      # re-saves). No restore-keys: eval:fetch skips a file that exists, so a photo swapped at the
      # same path would restore stale, fail its hash, never re-save, and stay red until a purge.
      # The cache saves only on success: if a cold run exceeds 30 minutes, every run stays cold.
      - uses: actions/cache@v4
        with:
          path: evals/photos
          key: eval-photos-${{ hashFiles('evals/manifest.json', 'evals/extract.ts', 'apps/web/src/lib/capture/mediapipe.ts', 'apps/web/src/lib/capture/photo.ts', 'apps/web/package.json') }}
      - run: pnpm eval:fetch
      - run: pnpm eval:run
        env:
          EVAL_RESULTS: ${{ runner.temp }}/results.json
      - name: Summary
        continue-on-error: true
        env:
          FRESH: ${{ runner.temp }}/results.json
        run: |
          node -e '
            const fs = require("node:fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            const fresh = read(process.env.FRESH), committed = read("evals/results.json");
            const keys = ["agreement", "accuracy", "falseRejectRate", "catchRate"];
            const rows = ["| Set | Metric | Committed | This run | Delta |", "| --- | --- | --- | --- | --- |"];
            for (const set of ["metrics", "holdout"])
              for (const k of keys) {
                const c = committed[set][k], f = fresh[set][k];
                rows.push(`| ${set === "metrics" ? "tuning" : "holdout"} | ${k} | ${c} | ${f} | ${(f - c).toFixed(4)} |`);
              }
            const head = `## Eval weekly\n\n${fresh.counts.photos} photos, MediaPipe ${fresh.mediapipe}. Report only: drift never fails this job.\n\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, head + rows.join("\n") + "\n");
          '
